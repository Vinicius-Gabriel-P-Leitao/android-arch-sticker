name: Build and Release APK

# Trigger: quando criar uma tag que comece com 'v'
on:
  push:
    tags:
      - 'v*'
  # Opcional: rodar manualmente
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 
    
    steps:
    # 1. Checkout do código
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # 2. Setup Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    # 3. Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    # 4. Cache Gradle dependencies
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Git LFS
      run: | 
        git lfs install
        git lfs pull
        git lfs fetch
    
    # 5. Grant execute permission for gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory:  android-arch-sticker/Android
    
    # 8. Build Release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease
      working-directory: android-arch-sticker/Android

    - name: List generated files
      run: ls -R
    
    # 9. Get version from tag
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    # 10. Create Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.get_version.outputs.VERSION }}
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        body: |
          🚀 Nova versão do app Android!
          
          **Mudanças nesta versão:**
          - [Adicione suas mudanças aqui]
          
          **Downloads disponíveis:**
          - **APK Universal**: Compatível com todos os dispositivos
          - **APK ARM64**: Para dispositivos 64-bit (mais modernos)
          - **APK ARMv7**: Para dispositivos 32-bit (mais antigos)
          
          **Como instalar:**
          1. Baixe o APK Universal (recomendado)
          2. Habilite "Instalar apps de fontes desconhecidas" nas configurações
          3. Toque no APK baixado para instalar
          
          **Requisitos:**
          - Android 5.0 (API 21) ou superior
        files: |
            **/app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
